- assertVisible: Tone 550 Hz
- assertVisible: Play
- stopApp
- launchApp
- assertVisible: Chapter II. The Law of Club and Fang
- assertVisible: CW speed 22 WPM
- assertVisible: Tone 550 Hz
- assertVisible: Play
